<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Chat Viewer</title>
    <link rel="stylesheet"href="style.css">
</head>

<body>

    <h1>WhatsApp Chat Viewer</h1>

    <p>Upload your WhatsApp exported chat file</p>

    <input type="file" id="chatFile">
    <div id="nameSelection" style="display: none;">
    <label for="myName">Who are you in this chat?</label>
    <select id="myName"></select>
    <button id="openChat">Open Chat</button>
</div>
    <div id="chatContainer"></div>
<script src="script.js"></script>
</body>
</html>
